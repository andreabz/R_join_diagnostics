name: R unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("data.table", "testthat"), repos = "https://cloud.r-project.org")'

      - name: Run unit tests
        run: Rscript -e 'testthat::test_file("test-join-audit.R")'
