name: R unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::data.table, any::testthat
          needs: check

      - name: Verify test dependencies
        run: Rscript -e 'stopifnot(requireNamespace("data.table", quietly = TRUE), requireNamespace("testthat", quietly = TRUE))'

      - name: Run unit tests
        run: Rscript -e 'testthat::test_file("test-join-audit.R")'
